name = "warehouse-quality-integration"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "warehouse_quality_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "warehouse-quality-attachments"

[triggers]
crons = ["0 3 * * *"]

[vars]
# Days before expiry to raise a warehouse alert. Comma-separated.
EXPIRY_ALERT_LEAD_DAYS = "90,30"
