name = "qualitycheck"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "warehouse-quality-db"
database_id = "d34bab08-b4a0-432e-bf83-889a649b8e62"

[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves static files (index.html, app.js, ...)
# directly and never invokes the Worker at all — which would let the
# suspended-service kill switch and the real session auth get silently
# bypassed for page loads while still correctly gating /api/*.
run_worker_first = true
# The default ("auto-trailing-slash") redirects a request for the literal
# path /index.html to / — which breaks GET /app (src/index.ts), which
# session-gates the SPA shell by fetching exactly that asset path itself.
html_handling = "none"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "warehouse-quality-attachments"

[triggers]
crons = ["0 3 * * *"]

[vars]
# Days before expiry to raise a warehouse alert. Comma-separated.
EXPIRY_ALERT_LEAD_DAYS = "90,30"

# Request rate limits (src/rateLimit.ts). Workers rate-limiting binding:
# counted per key, per Cloudflare location, over `period` seconds (10 or
# 60). namespace_id just has to be unique per limiter in this account.
# Sign-in and admin/backup, per IP.
[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "3101"
simple = { limit = 20, period = 60 }

# The API, per signed-in user (per IP when signed out).
[[unsafe.bindings]]
name = "API_LIMITER"
type = "ratelimit"
namespace_id = "3102"
simple = { limit = 300, period = 60 }

# Exports, COAs and imports, per user.
[[unsafe.bindings]]
name = "HEAVY_LIMITER"
type = "ratelimit"
namespace_id = "3103"
simple = { limit = 30, period = 60 }

# ---------------------------------------------------------------- staging
# A fully separate Worker + D1 + R2 for demos/presentations — its own
# resources end to end, so nothing a demo does (receiving, deciding,
# resetting data) can touch production data or eat into production's D1
# daily quota. Deployed by .github/workflows/deploy-staging.yml on pushes
# to the `staging` branch; see docs/deployment.md "Staging / demo
# environment" for one-time setup (ADMIN_PASSWORD secret, seeding).
[env.staging]
name = "qualitycheck-demo"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "warehouse-quality-db-staging"
database_id = "1c387ad1-f61c-4124-8f2e-06d811b17d81"

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.staging.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "warehouse-quality-attachments-staging"

[env.staging.triggers]
crons = []

[env.staging.vars]
EXPIRY_ALERT_LEAD_DAYS = "90,30"

# Separate namespace ids from production's (3101-3103) so a demo session's
# traffic is never counted against — or throttled by — production's limits.
[[env.staging.unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "3201"
simple = { limit = 20, period = 60 }

[[env.staging.unsafe.bindings]]
name = "API_LIMITER"
type = "ratelimit"
namespace_id = "3202"
simple = { limit = 300, period = 60 }

[[env.staging.unsafe.bindings]]
name = "HEAVY_LIMITER"
type = "ratelimit"
namespace_id = "3203"
simple = { limit = 30, period = 60 }

