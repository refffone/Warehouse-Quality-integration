name: Deploy to Cloudflare Workers

# This repo's default branch doubles as its deploy branch — every push
# here should go live. If that branch is ever renamed, update the trigger
# below to match.
on:
  push:
    branches:
      - claude/warehouse-quality-integration-1o96qv
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Fails the deploy on a type error instead of shipping broken code.
      - run: npm run typecheck

      # Schema changes go out before the code that needs them. Migrations
      # are applied with `wrangler d1 migrations apply`, which records each
      # applied file in the d1_migrations table and only runs new ones; a
      # failing migration fails the deploy, before the code goes live.
      #
      # Deploys used to run every file with `d1 execute` and ignore the
      # errors, so production had 0001–0020 applied with no record of it.
      # The baseline step records those (idempotent — safe on every run);
      # see scripts/d1-migrations-baseline.sql.
      - name: Record migrations applied before tracking (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A scoped custom token still can't call Cloudflare's /memberships
          # endpoint, which wrangler otherwise uses to auto-resolve the
          # account — that call needs broader access than the token grants.
          # Setting the account id directly skips that lookup. Not a
          # secret (it's visible in the dashboard URL), so it's fine inline.
          CLOUDFLARE_ACCOUNT_ID: b7bd5f5cc893306ff1bcc06daed8dc74
        run: npx wrangler d1 execute warehouse-quality-db --remote --file=scripts/d1-migrations-baseline.sql

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7bd5f5cc893306ff1bcc06daed8dc74
          # Skips wrangler's "are you sure?" prompt in CI.
          CI: "true"
        run: npx wrangler d1 migrations apply warehouse-quality-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b7bd5f5cc893306ff1bcc06daed8dc74
