<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse · Quality</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237c6aff' d='M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2Z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c6aff" />
  <script>
    (function () {
      var lang = localStorage.getItem("wq_lang") || "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    })();
  </script>
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2Z"/></svg></span>
        <span class="brand-name">Warehouse <em>·</em> Quality</span>
      </div>
      <nav id="tabs" class="tabs"></nav>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="top-actions">
          <button id="push-btn" class="icon-btn" title="Enable push notifications" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9a6 6 0 0 1 9-5.2"/><path d="M6 10c0 5-2 6-2 6h14"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/><path d="M19 3v6"/><path d="M16 6h6"/></svg>
          </button>
          <button id="notif-btn" class="icon-btn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
            <span id="notif-count" class="notif-count" hidden>0</span>
          </button>
          <span class="role-switch">
            <span id="signed-in-as-label">Signed in as</span>
            <b id="signed-in-as-name"></b>
            <span id="signed-in-as-role" class="muted small"></span>
          </span>
          <button id="logout-btn" class="btn ghost sm" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span id="logout-label">Log out</span>
          </button>
          <button id="lang-toggle" class="btn ghost sm" type="button">AR</button>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
