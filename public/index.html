<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse · Quality</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      var lang = localStorage.getItem("wq_lang") || "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Warehouse <em>·</em> Quality</span>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div class="top-actions">
        <button id="notif-btn" class="icon-btn" title="Notifications">
          🔔<span id="notif-count" class="notif-count" hidden>0</span>
        </button>
        <span class="role-switch">
          <span id="signed-in-as-label">Signed in as</span>
          <b id="signed-in-as-name"></b>
          <span id="signed-in-as-role" class="muted small"></span>
        </span>
        <button id="logout-btn" class="btn ghost sm" type="button">Log out</button>
        <button id="lang-toggle" class="btn ghost sm" type="button">AR</button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
